packages:
  - packages/core
  - packages/orms/*
  - packages/realtime/*
  - packages/frameworks/*
  - packages/protocols/*
  - examples/*
  - tools/*

allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  "@scarf/scarf": false
  "@swc/core": true
  better-sqlite3: true
  cpu-features: false
  esbuild: true
  mongodb-memory-server: true
  prisma: true
  protobufjs: true
  ssh2: false

# Security floors for transitive dependencies of the private example apps and
# tools/benchmark (none reach a published @kavo/* package, whose only
# dependencies are peers). Each stays within the major its parent asks for,
# except deepmerge-ts (7 → 8, Prisma CLI config loading) and uuid (8 → 11,
# hyperid's fallback when crypto.randomUUID is missing), whose advisories are
# fixed only in the next major; both uses are API-compatible across it.
overrides:
  "@mikro-orm/better-sqlite>better-sqlite3": "^13.0.2"
  "js-yaml@<5.2.2": "^5.2.3"
  "vitepress>vite": "^6.4.3"
  "fast-uri@>=3.0.0 <3.1.8": "^3.1.8"
  "multer@<2.4.0": "^2.4.0"
  "mysql2@<3.23.1": "^3.23.1"
  "postcss@<8.5.23": "^8.5.23"
  "qs@>=6.0.0 <6.16.0": "^6.16.0"
  "deepmerge-ts@<8.0.0": "^8.0.2"
  "uuid@>=8.0.0 <11.1.1": "^11.1.1"
