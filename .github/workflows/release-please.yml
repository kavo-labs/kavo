name: release-please

on:
  # Opens / updates the standing release PR as commits land on main, and —
  # because the release PR branch is now authored by the GitHub App, not the
  # default GITHUB_TOKEN — this same `push` fires on the release PR's own
  # squash-merge, which is what cuts the tag + GitHub Release. A GITHUB_TOKEN
  # push is suppressed to avoid recursion; an App push is not.
  push:
    branches: [main]
  # Belt-and-braces: the merge also arrives as a pull_request `closed` event.
  pull_request:
    types: [closed]
  # Manual escape hatch: re-run to reconcile a release that never got cut
  # (manifest ahead of tags).
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.merged == true &&
       github.event.pull_request.head.ref == 'release-please--branches--main')
    steps:
      # A GitHub App installation token, not a PAT: minted fresh per run
      # (~1h lifetime), owned by the repo rather than a person, and — unlike
      # GITHUB_TOKEN — its pushes/commits DO trigger downstream workflows, so
      # merging the release PR auto-cuts the tag and that tag's Release
      # auto-triggers publish.yml. Needs repo secrets RELEASE_PLEASE_APP_ID
      # and RELEASE_PLEASE_APP_PRIVATE_KEY (see docs/internals/adr/0041-*).
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
