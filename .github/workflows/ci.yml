name: CI

on:
  push:
    branches: [main]
  pull_request:

# Every job here only reads the checkout — nothing comments, pushes, or
# deploys. pages.yml and publish.yml already declare their permissions; this
# was the one workflow still inheriting the repo default.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# `pnpm check` runs the whole gate as one command locally. CI splits it in
# two — `build` (compile, types, boundaries, lint) and `test` — because a
# status badge can only report a job, never a step: one combined job can say
# "CI failing" but never "the build is fine, a test regressed". The halves
# are disjoint and their union is exactly `pnpm check`, which
# `tests/ci-workflow.spec.ts` asserts against this file so a step added to
# the gate cannot silently stop running here. They also run in parallel, so
# the split costs no wall-clock.
jobs:
  build:
    name: build (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["lts/-1", "lts/*", "current"]

    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `generate` first: the Prisma client it emits is what `build` and
      # `typecheck` compile @kavo/prisma against.
      - name: Build
        run: pnpm run generate && pnpm run build && pnpm run typecheck && pnpm run depcruise && pnpm run lint

  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["lts/-1", "lts/*", "current"]

    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # No `build` step: vitest aliases every `@kavo/*` specifier straight to
      # package `src/` (see vitest.config.ts), so the suite never reads
      # `dist/`. `generate` is still required — it emits the Prisma client and
      # pushes the SQLite fixture schema the @kavo/prisma specs run against.
      - name: Test
        run: pnpm run generate && pnpm run test

  # Runs the entire vitest suite with Bun as the runtime executing vitest
  # itself, not just Node — the mirror image of the `test` job. This is a
  # real, un-nested top-level run: tests/bun-compat.spec.ts documents that
  # nesting a full `bun vitest` invocation inside another (Node) vitest
  # process reliably hangs on mongodb-memory-server contention, which is why
  # that file only spawns small isolated Bun probes rather than the whole
  # suite. Run as CI's own process tree, that problem does not exist.
  #
  # Its own job rather than a step in `test` because it needs a Bun toolchain
  # none of the other jobs do, and it stays outside `pnpm check` for the same
  # reason `coverage` and `docs` do: `tests/ci-workflow.spec.ts` only
  # cross-checks the `build`/`test` split against the gate, so a job outside
  # that split is exempt by design.
  bun-compat:
    name: test (bun)
    runs-on: ubuntu-latest
    # The job's own rationale above is a documented hang failure mode
    # (mongodb-memory-server contention under nesting). A bound turns any
    # recurrence into a fast red instead of sitting on a runner for GitHub's
    # 6-hour default, the same reasoning `docs` uses below.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      # No `build` step, same as `test`: vitest aliases every `@kavo/*`
      # specifier straight to package `src/`, so the suite never reads
      # `dist/`. `generate` is still required for the same reason it is in
      # `test` — the Prisma client and the SQLite fixture schema. Runs
      # `pnpm run test:bun` (not a bare `bun run vitest run` here) so
      # `tests/ci-workflow.spec.ts` can see the invocation the same way it
      # sees every other job's `pnpm run <script>` step.
      - name: Test under Bun
        run: pnpm run generate && pnpm run test:bun

  # `@kavo/nest`'s peer range spans three NestJS majors (10/11/12), but
  # `build`/`test` above only ever install whatever version is pinned in
  # devDependencies — one major, never all three. This job actually installs
  # each supported major in turn and re-runs @kavo/nest's own suite against
  # it, so a peer range widened in package.json is backed by a real install +
  # test rather than an unverified claim. v10 is not in the matrix: it is
  # already the oldest release ADR history predates, and nothing currently
  # regression-tests it either — widen the matrix if that changes. Deliberately
  # its own job rather than a step in `pnpm check`: it reinstalls dependencies
  # mid-job, which would corrupt the workspace state every other gate step
  # relies on if it ran inline.
  nest-compat:
    name: nest compat (nestjs v${{ matrix.nest }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        nest: ["11", "12"]

    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Overrides only @kavo/nest's own install, not the lockfile: the
      # matrix leg's point is exercising the peer range, not shipping this
      # version as the pinned devDependency.
      - name: Install NestJS v${{ matrix.nest }}
        run: |
          pnpm --filter @kavo/nest add -D \
            @nestjs/common@^${{ matrix.nest }} \
            @nestjs/core@^${{ matrix.nest }} \
            @nestjs/platform-express@^${{ matrix.nest }} \
            @nestjs/swagger@^${{ matrix.nest }} \
            @nestjs/testing@^${{ matrix.nest }}

      - name: Test @kavo/nest against NestJS v${{ matrix.nest }}
        run: pnpm run generate && pnpm run test:nest-compat

  # Deliberately its own job rather than a step in `pnpm check`. It re-runs
  # the whole suite under v8 instrumentation, so folding it into the gate
  # would roughly double the command developers run all day for a signal
  # that only matters per push. A single node version is enough: coverage
  # measures which lines the suite reaches, which does not vary by runtime.
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fails on the thresholds in `vitest.coverage.config.ts`, so coverage
      # can only ratchet up. `generate` for the same reason the `test` job
      # needs it.
      - name: Coverage
        run: pnpm run generate && pnpm run test:coverage

  format:
    name: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

  docs:
    name: docs
    runs-on: ubuntu-latest
    # The build itself takes seconds; a bound turns a hung SSR render into a
    # fast red instead of letting it sit on a runner for GitHub's 6-hour
    # default.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Not path-filtered on purpose: docs/.vitepress/config.mts reads
      # packages/core/package.json at build time, so a packaging change can
      # break the docs build without touching docs/. Builds only — pages.yml
      # still owns deployment.
      - name: Build docs
        run: pnpm docs:build

  doc-links:
    name: doc links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Every `docs/**.md` path mentioned by a tracked file, and every
      # VitePress sidebar link, must resolve. Moving a docs directory leaves
      # the mentions behind, and some of the files carrying them (package
      # READMEs, `src/` doc comments, the adopter-facing skills in
      # `extensions/`) ship to npm — so a dead reference is one an adopter
      # follows. The `docs` job above cannot cover either class: VitePress
      # only resolves links inside the pages it renders, so it never sees a
      # reference from `packages/` and never reads the sidebar config.
      # Needs no toolchain: pure git+sh.
      - name: Check doc links
        run: ./scripts/check-doc-links.sh
