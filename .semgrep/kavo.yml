# Kavo-specific Semgrep rules (issue #495). Each rule targets one way attacker
# input could reach a query or the runtime as code rather than data. Every rule
# has a fixture under `.semgrep/tests/<rule-id>.ts` whose `// ruleid:` lines
# must match and whose `// ok:` lines must not; CI runs both the fixtures and
# a scan of `packages/`, and fails on any finding. A false positive gets a
# narrowed rule, never a blanket `nosemgrep`.
rules:
  # The #367 class: a SQL fragment built by string interpolation. TypeORM's
  # query builder takes identifiers as raw SQL, so `@kavo/typeorm` does build
  # fragments, but only from identifiers and generated bind-parameter names,
  # never from a value. The allowlist below is that vocabulary, each name one
  # the adapter derives itself rather than reads off the request:
  #
  #   column                        FilterTranslator.columnRef, which rejects
  #                                 any segment that is not a plain identifier
  #   segment, alias                that same check, per path segment, and the
  #                                 join aliases built from it
  #   this.alias, this.rootAlias,   aliases the adapter mints
  #   parentAlias
  #   parameter, keyword            generated `:pN` names and the IN / NOT IN
  #                                 keyword chosen from the AST operator
  #   this.idField, identifierField, entity metadata and resolved config
  #   deleteConfig.field,
  #   node.relation.name,
  #   relation, relatedIdField      (relation is resolved through
  #                                 relationMetadataOf before it is used)
  #
  # Anything else interpolated, `${value}`, `${id}`, `${query.search}`, fails.
  # Adding a name here is a review decision: it must be an identifier the
  # adapter validated or derived from metadata.
  - id: kavo-no-template-string-into-query-builder
    languages: [typescript]
    severity: ERROR
    message: >-
      String-built SQL fragment passed to a query-builder method with an interpolation outside the
      vetted identifier vocabulary. Identifiers must come from entity metadata (validated), and
      values must be bound parameters (see #367 and .semgrep/kavo.yml).
    patterns:
      - pattern-either:
          - pattern: $QB.$M(..., `...${$X}...`, ...)
          - pattern: $QB.$M(..., "..." + $X, ...)
          - pattern: $QB.$M(..., $X + "...", ...)
      - metavariable-regex:
          metavariable: $M
          regex: ^(where|andWhere|orWhere|orderBy|addOrderBy|having|andHaving|orHaving|select|addSelect|groupBy|addGroupBy|leftJoin|innerJoin|leftJoinAndSelect|innerJoinAndSelect|query)$
      - metavariable-pattern:
          metavariable: $X
          patterns:
            - pattern-not: column
            - pattern-not: segment
            - pattern-not: alias
            - pattern-not: parentAlias
            - pattern-not: this.alias
            - pattern-not: this.rootAlias
            - pattern-not: parameter
            - pattern-not: keyword
            - pattern-not: this.idField
            - pattern-not: identifierField ?? this.idField
            - pattern-not: deleteConfig.field
            - pattern-not: node.relation.name
            - pattern-not: relation
            - pattern-not: relatedIdField
    paths:
      include: ["packages/orms/**/src/**"]

  # `$where`, `$function` and `$accumulator` run JavaScript on the MongoDB
  # server. `@kavo/mongoose` never needs them, so any mention in its source
  # is a finding, whatever builds it.
  - id: kavo-no-mongo-code-operators
    languages: [typescript]
    severity: ERROR
    message: Server-side JavaScript operators must never be built from request input.
    pattern-regex: \$(where|function|accumulator)\b
    paths:
      include: ["packages/orms/mongoose/src/**"]

  - id: kavo-no-raw-prisma
    languages: [typescript]
    severity: ERROR
    message: Raw Prisma queries bypass the translated, parameterized where.
    pattern-either:
      - pattern: $C.$queryRawUnsafe(...)
      - pattern: $C.$executeRawUnsafe(...)
    paths:
      include: ["packages/orms/prisma/src/**"]

  - id: kavo-no-dynamic-code
    languages: [typescript]
    severity: ERROR
    message: Dynamic code evaluation in a published package.
    pattern-either:
      - pattern: eval(...)
      - pattern: new Function(...)
    paths:
      include: ["packages/*/src/**", "packages/*/*/src/**"]
